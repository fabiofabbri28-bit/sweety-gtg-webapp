<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sweety → GTG | {% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .btn-primary { background: #1F4E79; border-color: #1F4E79; }
    .btn-primary:hover { background: #163a5f; border-color: #163a5f; }
    .btn-success { background: #198754; font-size: 1.1rem; padding: .6rem 2rem; }
    .total-box { background: #fff3cd; border-radius: 8px; padding: 1rem 1.5rem; font-size: 1.05rem; }
    .total-box .big { font-size: 1.4rem; font-weight: 700; color: #1F4E79; }
    table th { background: #1F4E79; color: white; }
    .badge-skip { background: #e9ecef; color: #6c757d; font-size: .8rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#1F4E79;">
  <div class="container">
    <span class="navbar-brand">Sweety → GTG &nbsp;|&nbsp; Workflow Mensile</span>
  </div>
</nav>
<div class="container py-4">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
